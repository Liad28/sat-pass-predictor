[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "satpass"
version = "0.1.0"
description = "Satellite pass prediction from TLEs (SGP4 via Skyfield)"
requires-python = ">=3.10"
dependencies = ["skyfield>=1.48", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
